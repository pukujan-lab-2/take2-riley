  - title: CNA, Long-term care
    openings: 6
    hospital: Hudson Park Brooklyn
    unit: long-term care, 60 beds
    shift: weekends
    hours: 2 x 12 h
    pay: $21 to $26 an hour, plus a $2 weekend differential
    description:
