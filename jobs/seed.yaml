        You help long-term residents with daily living on a 60-bed unit, working weekend 12-hour shifts. For many
        residents this is home, so the work is personal care, safety, and getting to know each person's routine.
      duties:
        - Help residents bathe, dress, eat, toilet and move
        - Take vital signs and weights and report changes to the nurse
        - Reposition residents and help prevent falls and pressure sores
        - Keep rooms clean and safe and answer call lights
        - Record care in the resident's chart
      requirements:
        - New York State nurse aide certification, listed on the Nurse Aide Registry
        - Current BLS
        - Able to work 12-hour Saturday and Sunday shifts
        - Able to lift, transfer and reposition residents with help or a lift
      preferred:
        - Experience in a nursing home or long-term care
        - Dementia care training
    facts:
      pay: $21 to $26 an hour depending on experience, plus a $2 an hour weekend differential
      schedule: two 12-hour shifts, Saturday and Sunday, 7 am to 7 pm
      unit: a 60-bed long-term care unit
      location: downtown Brooklyn, near the DeKalb Avenue station
      benefits: *benefits
      start: *start
      remote: no, this is an in-person role
    questions:
      - { id: license_cna, about: person, ask: "Are you a Certified Nursing Assistant on the New York registry?", kind: yes_no, knockout: true, points: 0, fact: { license: NY CNA } }
      - use: work_authorization
      - { id: years_cna, ask: "How many years have you worked as a CNA?", kind: number, good: "at least 1", points: 30 }
      - use: certifications
      - { id: weekends, ask: "The role is Saturday and Sunday, two 12-hour day shifts. Does that work for you?", kind: yes_no, knockout: true, points: 30, fact: { shift: weekends } }
      - use: start_date
