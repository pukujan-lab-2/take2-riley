# Demo data: Hudson Park Health's five sites and twenty-six open roles (docs/BUILD-PLAN.md, "Jobs, hospitals and shifts").
# All made up; pay ranges are plausible for New York, not real offers. riley/seed.py writes it into a sandbox.
#
# questions: `use: <id>` takes that question from screen.yaml as it is; anything else is the role's own question.
# `fact:` says what a confirmed answer tells us about the person, for matching (riley/match.py facts_from):
#   {license: NY RN} or {shift: nights} for a yes/no, `years`, `certs` or `units` for words to read the facts from.
# criteria targets: {license: ...}, {cert: ...} (or a list, any one counts), {years: N}, {shift: ...}, {unit: ...},
# {units: N} (that many kinds of unit). reason and change are Dana's words when a required item falls short.

benefits: &benefits health, dental and vision from day one, a 403(b) with a 5 percent match, and tuition help
start: &start orientation classes start every two weeks

# Dana's open interview times, shared by every seeded job unless a job lists its own.
slots: &slots
  - 2026-11-09T10:00:00-05:00
  - 2026-11-09T14:00:00-05:00
  - 2026-11-10T11:00:00-05:00
  - 2026-11-10T16:00:00-05:00
  - 2026-11-11T09:30:00-05:00
  - 2026-11-12T13:00:00-05:00

hospitals:
  - { name: "Hudson Park Midtown", borough: Manhattan, address: "410 West 58th Street, New York, NY 10019" }
  - { name: "Hudson Park Bronx", borough: Bronx, address: "2150 Grand Concourse, Bronx, NY 10457" }
  - { name: "Hudson Park Brooklyn", borough: Brooklyn, address: "88 Flatbush Avenue Extension, Brooklyn, NY 11201" }
  - { name: "Hudson Park Virtual Care", borough: remote, address: "works from home in New York State" }
  - { name: "Hudson Park Float Pool", borough: any site, address: "every Hudson Park hospital" }

# Shared required items, so each job says only what is its own.
rn: &rn
  kind: required
  name: New York RN license
  target: { license: NY RN }
  reason: This role needs an active New York State RN license.
  change: Once your New York license is active, call this number and we'll pick up where you left off.
bls: &bls
  kind: required
  name: current BLS
  target: { cert: BLS }
  reason: This role needs a current BLS certification.
  change: Renew your BLS and call this number; your answers and your date are kept.
acls: &acls
  kind: required
  name: current ACLS
  target: { cert: ACLS }
  reason: This role needs a current ACLS certification.
  change: With ACLS done, call this number and we'll look at this role again.

jobs:
  - title: RN, Medical-Surgical
    openings: 4
    hospital: Hudson Park Midtown
    # The job screen.yaml describes: its questions and facts come from there, and the row screen.yaml made before
    # this seed is taken over rather than a second one added (riley/seed.py).
    from_screen: true
    unit: 5 West, 32 beds
    shift: nights
    hours: 3 x 12 h
    pay: $48 to $62 an hour, plus a $6 night differential
    description:
      about: >-
        You care for four to six adults on a 32-bed medical-surgical floor overnight, most of them recovering from
        surgery or admitted for infections, diabetes, falls or heart and lung problems. Nights mean pain control,
        wound and drain checks, blood draws and lab follow-up, and getting patients ready for morning procedures and
        discharges.
      duties:
        - Assess patients at the start of shift and through the night, and act on changes
        - Give scheduled and as-needed medicines, IV fluids and blood products
        - Care for surgical wounds, drains, catheters and IV lines
        - Call the covering provider about abnormal labs, vital signs or new symptoms
        - Teach patients and families before discharge and chart in the electronic record
        - Work with the patient care technician and hand off clearly at shift change
      requirements:
        - Active New York State RN license
        - Current BLS from the American Heart Association
        - At least one year of hospital RN experience
        - Able to work 12-hour nights, including rotating weekends and holidays
        - Able to stand and walk most of the shift and help move patients
      preferred:
        - BSN
        - ACLS
        - Telemetry or step-down experience
    options: [{ kind: per_diem, note: "per diem nights on 5 West" }, { kind: site, note: "Hudson Park Bronx telemetry nights" }]
    criteria:
      - *rn
      - *bls
      - { kind: required, name: "1 year as an RN", target: { years: 1 }, reason: "This role needs at least a year of RN experience.", change: "Call us again once you have a year as an RN." }
      - { kind: required, name: "nights", target: { shift: nights }, reason: "This role is nights only.", change: "If nights become possible, call this number." }
      - { kind: weighted, name: "3 years as an RN", points: 20, target: { years: 3 } }
      - { kind: bonus, name: "ACLS", points: 10, target: { cert: ACLS } }
      - { kind: bonus, name: "telemetry", points: 10, target: { unit: telemetry } }

  - title: RN, ICU
    openings: 2
    hospital: Hudson Park Midtown
    unit: MICU, 16 beds
    shift: days
    hours: 3 x 12 h
    pay: $55 to $72 an hour
    description:
      about: >-
        You care for one or two critically ill adults in a 16-bed medical ICU on day shift, often patients on
        ventilators, drips to support blood pressure, or dialysis at the bedside. The day is close monitoring,
        titrating medicines, joining rounds with the ICU team, and keeping families informed.
      duties:
        - Monitor and manage patients on ventilators, arterial lines and central lines
        - Titrate vasoactive and sedation drips to orders and protocols
        - Respond to rapid responses and codes on the unit
        - Take part in daily rounds and carry out the care plan
        - Support families through hard news and goals-of-care talks
      requirements:
        - Active New York State RN license
        - Current BLS and ACLS
        - At least two years of acute care RN experience
        - Able to work 12-hour day shifts, including rotating weekends and holidays
      preferred:
        - One or more years of ICU experience
        - CCRN certification
        - BSN
    facts:
      pay: $55 to $72 an hour depending on experience
      schedule: three 12-hour day shifts a week, 7 am to 7 pm, every third weekend
      unit: a 16-bed medical ICU with a ratio of one nurse to two patients
      location: Midtown Manhattan, a short walk from the 59th Street subway station
      benefits: *benefits
      start: *start
      remote: no, this is an in-person bedside role
    questions:
      - use: license
      - use: work_authorization
      - use: years_rn
      - use: acute_care
      - use: certifications
      - { id: icu, ask: "Have you worked in an ICU or other critical care unit? For how long?", kind: text, good: "two years or more of acute care, ICU counts most", points: 20, fact: units }
      - { id: days, ask: "The role is three 12-hour day shifts a week, 7 am to 7 pm. Does that work for you?", kind: yes_no, knockout: true, points: 15, fact: { shift: days } }
      - { id: ccrn, ask: "Do you have your CCRN?", kind: yes_no, good: "CCRN is a plus", points: 10, fact: { cert: CCRN } }
      - use: start_date
      - use: pay_expectation
    options: [{ kind: shift, note: "the MICU night team, when it has an opening" }]
    criteria:
      - *rn
      - *bls
      - *acls
      - { kind: required, name: "2 years of acute care", target: { years: 2 }, reason: "This role needs at least two years of acute care nursing.", change: "Call us again once you have two years; our med-surg and telemetry roles build toward it." }
      - { kind: required, name: "days", target: { shift: days }, reason: "This role is days only.", change: "If days become possible, call this number." }
      - { kind: bonus, name: "CCRN", points: 15, target: { cert: CCRN } }
      - { kind: bonus, name: "ICU experience", points: 10, target: { unit: icu } }

  - title: RN, Emergency
    openings: 3
    hospital: Hudson Park Midtown
    unit: Emergency Department
    shift: evenings
    hours: 3 x 12 h
    pay: $52 to $68 an hour, plus a $4 evening differential
    description:
      about: >-
        You work evening shifts in a busy emergency department, taking adults and children from triage through
        treatment, admission or discharge. Evenings bring the heaviest volume, so the work is quick assessment,
        early treatment, and moving patients safely while new ones keep arriving.
      duties:
        - Triage walk-in and ambulance patients and set priority
        - Start IVs, draw labs, give medicines and monitor response
        - Care for trauma, stroke, chest pain and sepsis patients under set protocols
        - Assist with procedures and codes
        - Prepare patients for admission, transfer or discharge with clear teaching
      requirements:
        - Active New York State RN license
        - Current BLS, ACLS and PALS
        - At least one year of RN experience
        - Able to work 12-hour evening shifts, including weekends and holidays
        - Able to stand, move and lift patients for long stretches
      preferred:
        - Emergency department experience
        - TNCC
        - ENPC or a trauma course
    facts:
      pay: $52 to $68 an hour depending on experience, plus a $4 an hour evening differential
      schedule: three 12-hour evening shifts a week, 11 am to 11 pm, every third weekend
      unit: a 40-bay emergency department with a fast-track area
      location: Midtown Manhattan, a short walk from the 59th Street subway station
      benefits: *benefits
      start: *start
      remote: no, this is an in-person bedside role
    questions:
      - use: license
      - use: work_authorization
      - use: years_rn
      - use: acute_care
      - use: certifications
      - { id: pals, ask: "Do you have current PALS? And TNCC?", kind: text, good: "PALS is required; TNCC is a plus", knockout_if: "no current PALS", points: 15, fact: certs }
      - { id: evenings, ask: "The role is three 12-hour evening shifts a week, 11 am to 11 pm. Does that work for you?", kind: yes_no, knockout: true, points: 15, fact: { shift: evenings } }
      - use: start_date
      - use: pay_expectation
    criteria:
      - *rn
      - *bls
      - *acls
      - { kind: required, name: "current PALS", target: { cert: PALS }, reason: "The emergency department sees children, so this role needs a current PALS.", change: "Once your PALS is done, call this number and we'll look again." }
      - { kind: required, name: "1 year as an RN", target: { years: 1 }, reason: "This role needs at least a year of RN experience.", change: "Call us again once you have a year as an RN." }
      - { kind: required, name: "evenings", target: { shift: evenings }, reason: "This role is evenings only.", change: "If evenings become possible, call this number." }
      - { kind: bonus, name: "TNCC", points: 10, target: { cert: TNCC } }
      - { kind: bonus, name: "emergency experience", points: 10, target: { unit: ed } }

  - title: RN, Telemetry
    openings: 3
    hospital: Hudson Park Bronx
    unit: step-down telemetry, 28 beds
    shift: nights
    hours: 3 x 12 h
    pay: $50 to $64 an hour, plus a $6 night differential
    description:
      about: >-
        You care for adults on a 28-bed step-down telemetry unit overnight, mostly heart patients and those with
        heart rhythm problems who need continuous monitoring. Nights are watching rhythms, acting fast on changes,
        and managing cardiac medicines and drips.
      duties:
        - Read and respond to heart rhythms on the central monitor
        - Give cardiac medicines and manage heparin and other drips to protocol
        - Care for patients after heart catheterization and device procedures
        - Recognize early decline and call a rapid response when needed
        - Teach patients about heart medicines, diet and follow-up
      requirements:
        - Active New York State RN license
        - Current BLS and ACLS
        - At least one year of RN experience
        - Pass a basic rhythm interpretation test
        - Able to work 12-hour nights, including rotating weekends and holidays
      preferred:
        - Telemetry or step-down experience
        - Med-surg experience
        - NIHSS stroke scale certification
    facts:
      pay: $50 to $64 an hour depending on experience, plus a $6 an hour night differential
      schedule: three 12-hour night shifts a week, 7 pm to 7 am, every third weekend
      unit: a 28-bed step-down telemetry unit with a ratio of one nurse to four patients
      location: the Bronx, on the Grand Concourse near the 174th-175th Street station
      benefits: *benefits
      start: *start
      remote: no, this is an in-person bedside role
    questions:
      - use: license
      - use: work_authorization
      - use: years_rn
      - use: acute_care
      - use: certifications
      - { id: nights, ask: "The role is three 12-hour night shifts a week, 7 pm to 7 am. Does that work for you?", kind: yes_no, knockout: true, points: 20, fact: { shift: nights } }
      - use: start_date
      - use: pay_expectation
    options: [{ kind: site, note: "Hudson Park Midtown med-surg nights" }]
    criteria:
      - *rn
      - *bls
      - *acls
      - { kind: required, name: "1 year as an RN", target: { years: 1 }, reason: "This role needs at least a year of RN experience.", change: "Call us again once you have a year as an RN." }
      - { kind: required, name: "nights", target: { shift: nights }, reason: "This role is nights only.", change: "If nights become possible, call this number." }
      - { kind: bonus, name: "med-surg experience", points: 10, target: { unit: med-surg } }
      - { kind: bonus, name: "telemetry experience", points: 10, target: { unit: telemetry } }

  - title: LPN, Rehab
    openings: 2
    hospital: Hudson Park Bronx
    unit: sub-acute rehab, 40 beds
    shift: days
    hours: 5 x 8 h
    pay: $32 to $40 an hour
    description:
      about: >-
        You care for adults recovering from surgery, strokes or long hospital stays on a 40-bed sub-acute rehab
        unit, working weekday day shifts under the direction of RNs. Most of the day is giving medicines, doing
        treatments, and helping patients get stronger so they can go home.
      duties:
        - Pass medicines by mouth, injection and feeding tube on schedule
        - Do wound care, finger-stick glucose checks and other treatments
        - Check vital signs and report changes to the RN or provider
        - Work with physical and occupational therapy on each patient's goals
        - Chart care and supervise nursing assistants on the unit
      requirements:
        - Active New York State LPN license
        - Current BLS (in-person class)
        - Able to work 8-hour day shifts, five days a week
        - Able to lift, transfer and reposition patients with help
      preferred:
        - IV therapy training or certification
        - One year in rehab, long-term care or sub-acute care
    facts:
      pay: $32 to $40 an hour depending on experience
      schedule: five 8-hour day shifts a week, 7 am to 3:30 pm, every other weekend
      unit: a 40-bed sub-acute rehab unit for patients after surgery or a stroke
      location: the Bronx, on the Grand Concourse near the 174th-175th Street station
      benefits: *benefits
      start: *start
      remote: no, this is an in-person bedside role
    questions:
      - { id: license_lpn, about: person, ask: "Do you hold an active Licensed Practical Nurse license in New York State?", kind: yes_no, knockout: true, points: 0, fact: { license: NY LPN } }
      - use: work_authorization
      - { id: years_lpn, ask: "How many years have you worked as an LPN?", kind: number, good: "at least 1", points: 25 }
      - use: certifications
      - { id: iv, ask: "Have you had IV therapy training?", kind: yes_no, good: "IV training is a plus", points: 15, fact: { cert: IV } }
      - { id: days, ask: "The role is five 8-hour day shifts a week, 7 am to 3:30 pm. Does that work for you?", kind: yes_no, knockout: true, points: 20, fact: { shift: days } }
      - use: start_date
      - use: pay_expectation
    criteria:
      - { kind: required, name: "New York LPN license", target: { license: NY LPN }, reason: "This role needs an active New York State LPN license.", change: "Once your New York LPN license is active, call this number." }
      - *bls
      - { kind: required, name: "days", target: { shift: days }, reason: "This role is days only.", change: "If days become possible, call this number." }
      - { kind: bonus, name: "IV therapy training", points: 15, target: { cert: IV } }

  - title: Patient Care Technician
    openings: 5
    hospital: Hudson Park Bronx
    unit: med-surg, 32 beds
    shift: nights
    hours: 3 x 12 h
    pay: $22 to $27 an hour, plus a $2 night differential
    description:
      about: >-
        You help nurses care for patients on a 32-bed med-surg floor overnight. You take vital signs, help patients
        wash, eat, walk and use the bathroom, and do blood draws and EKGs, telling the nurse about anything that
        looks off.
      duties:
        - Take and record vital signs, weights, intake and output
        - Help patients with bathing, toileting, feeding and moving
        - Draw blood and do 12-lead EKGs as ordered
        - Turn and reposition patients and help prevent falls
        - Report changes in condition to the RN right away
      requirements:
        - PCT or CNA certificate
        - Trained to do 12-lead EKGs and blood draws
        - Current BLS
        - High school diploma or GED
        - Able to work 12-hour nights
        - Able to lift and move patients and stand most of the shift
      preferred:
        - EKG certification
        - Phlebotomy certification
        - Hospital experience
    facts:
      pay: $22 to $27 an hour depending on experience, plus a $2 an hour night differential
      schedule: three 12-hour night shifts a week, 7 pm to 7 am, every third weekend
      unit: a 32-bed medical-surgical unit, working with the nurses on vitals, EKGs and blood draws
      location: the Bronx, on the Grand Concourse near the 174th-175th Street station
      benefits: *benefits
      start: *start
      remote: no, this is an in-person bedside role
    questions:
      - use: work_authorization
      - { id: pct_cert, about: person, ask: "Do you have a Patient Care Technician or CNA certificate?", kind: text, good: "either one", knockout_if: "neither", points: 0, fact: certs }
      - use: certifications
      - { id: skills, ask: "Are you trained to do 12-lead EKGs and blood draws?", kind: text, good: "both", points: 25, fact: certs }
      - { id: nights, ask: "The role is three 12-hour night shifts a week, 7 pm to 7 am. Does that work for you?", kind: yes_no, knockout: true, points: 25, fact: { shift: nights } }
      - use: start_date
      - use: pay_expectation
    criteria:
      - *bls
      - { kind: required, name: "PCT or CNA certificate", target: { cert: [PCT, CNA] }, reason: "This role needs a Patient Care Technician or CNA certificate.", change: "With either certificate, call this number and we'll pick it up." }
      - { kind: required, name: "nights", target: { shift: nights }, reason: "This role is nights only.", change: "If nights become possible, call this number." }
      - { kind: required, name: "EKG", target: { cert: EKG }, reason: "This role does 12-lead EKGs, so it needs EKG training.", change: "Once you have EKG training, call this number and we'll pick it up." }
      - { kind: required, name: "phlebotomy", target: { cert: phlebotomy }, reason: "This role does blood draws, so it needs phlebotomy training.", change: "Once you have phlebotomy training, call this number and we'll pick it up." }

  - title: RN, Labor and Delivery
    openings: 2
    hospital: Hudson Park Brooklyn
    unit: Labor and Delivery, 12 rooms
    shift: nights
    hours: 3 x 12 h
    pay: $52 to $66 an hour, plus a $6 night differential
    description:
      about: >-
        You care for women in labor, during birth and in the first hours after, on a 12-room labor and delivery unit
        overnight. The work includes fetal monitoring, managing labor medicines, helping in the delivery room and
        the operating room for C-sections, and first care of the newborn.
      duties:
        - Monitor mother and baby during labor and read fetal heart tracings
        - Give and adjust labor medicines such as oxytocin and magnesium
        - Assist with vaginal births and circulate or scrub for C-sections
        - Give first newborn care and start skin-to-skin and feeding
        - Respond to emergencies such as hemorrhage or a sudden drop in the baby's heart rate
      requirements:
        - Active New York State RN license
        - Current BLS and NRP
        - Labor and delivery experience, usually one to two years
        - Able to work 12-hour nights, including weekends and holidays
      preferred:
        - Intermediate fetal monitoring course
        - C-EFM certification
        - ACLS
    facts:
      pay: $52 to $66 an hour depending on experience, plus a $6 an hour night differential
      schedule: three 12-hour night shifts a week, 7 pm to 7 am, every third weekend
      unit: a 12-room labor and delivery unit with about 2,400 births a year
      location: downtown Brooklyn, near the DeKalb Avenue station
      benefits: *benefits
      start: *start
      remote: no, this is an in-person bedside role
    questions:
      - use: license
      - use: work_authorization
      - use: years_rn
      - { id: ld, ask: "Have you worked in labor and delivery? For how long?", kind: text, good: "at least a year in L&D", knockout_if: "no labor and delivery experience", points: 25, fact: units }
      - use: certifications
      - { id: nrp, ask: "Do you have current NRP? And have you done fetal monitoring training?", kind: text, good: "NRP is required; fetal monitoring is a plus", knockout_if: "no current NRP", points: 10, fact: certs }
      - { id: nights, ask: "The role is three 12-hour night shifts a week, 7 pm to 7 am. Does that work for you?", kind: yes_no, knockout: true, points: 15, fact: { shift: nights } }
      - use: start_date
      - use: pay_expectation
    criteria:
      - *rn
      - *bls
      - { kind: required, name: "current NRP", target: { cert: NRP }, reason: "This role needs a current NRP certification.", change: "Once your NRP is done, call this number." }
      - { kind: required, name: "labor and delivery experience", target: { unit: l&d }, reason: "This role needs at least a year in labor and delivery.", change: "Our med-surg roles are open to you now; call again once you have L&D experience." }
      - { kind: required, name: "1 year as an RN", target: { years: 1 }, reason: "This role needs at least a year of RN experience.", change: "Call us again once you have a year as an RN." }
      - { kind: required, name: "nights", target: { shift: nights }, reason: "This role is nights only.", change: "If nights become possible, call this number." }
      - { kind: bonus, name: "fetal monitoring", points: 10, target: { cert: fetal monitoring } }

