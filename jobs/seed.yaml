      - { kind: required, name: "1 year as an RN", target: { years: 1 }, reason: "This role needs at least a year of RN experience.", change: "Call us again once you have a year as an RN." }
      - { kind: required, name: "evenings", target: { shift: evenings }, reason: "This role is evenings only.", change: "If evenings become possible, call this number." }
